<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Parlay</title>
<meta name="description" content="Weekly group parlay: live picks, scores and season standings.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F4F6FA;
  --ink: #0F172A;
  --ink-2: #4B5569;
  --ink-3: #7B849A;
  --line: #D9DEE8;
  --accent: #1E47C9;
  --accent-ink: #FFFFFF;
  --lead-bg: #EEF2FC;
  --win: #178A45;
  --win-bg: #DDF5E6;
  --loss: #CC3A2F;
  --loss-bg: #FBE3E0;
  --push: #8A93A6;
  --push-bg: #E8EBF1;
  --live: #C2670A;
  --live-bg: #FDEBD3;
  --live-dot: #E11D48;
  --masthead: #101A33;
  --masthead-ink: #F4F6FB;
  --masthead-muted: #9AA6C4;
  --shadow: 0 6px 18px rgba(16, 26, 51, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1220;
    --surface: #161C2C;
    --surface-2: #1D2436;
    --ink: #E9EDF5;
    --ink-2: #AEB7CB;
    --ink-3: #7F8AA3;
    --line: #2A3347;
    --accent: #7B9BFF;
    --accent-ink: #0D1220;
    --lead-bg: #1B2540;
    --win: #4CD787;
    --win-bg: #14301F;
    --loss: #FF7A6E;
    --loss-bg: #3A1A17;
    --push: #98A2B8;
    --push-bg: #262D3E;
    --live: #FBBF24;
    --live-bg: #3A2A0E;
    --live-dot: #FB7185;
    --masthead: #080C18;
    --masthead-ink: #F4F6FB;
    --masthead-muted: #8E9AB8;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }
.masthead { background: var(--masthead); color: var(--masthead-ink); border-top: 4px solid var(--accent); padding-block: 20px 0; }
.eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--masthead-muted); }
.masthead h1 {
  margin: 0;
  font-family: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  font-weight: 800; font-size: clamp(44px, 10vw, 64px); line-height: .92; letter-spacing: .01em; text-transform: uppercase;
}
.subline { margin: 10px 0 0; color: var(--masthead-muted); font-size: 14px; font-weight: 500; }
.tabs { display: flex; gap: 4px; margin-top: 18px; }
.tab {
  font: inherit; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 18px;
  letter-spacing: .04em; text-transform: uppercase; padding: 10px 16px 12px; border: 0; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--masthead-muted); cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
main { padding-top: 18px; }
.feed { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin: 0 0 12px; }
.feed .fdot { width: 8px; height: 8px; border-radius: 50%; background: var(--push); }
.feed.ok .fdot { background: var(--win); }
.feed.err .fdot { background: var(--loss); }
.feed .spacer { flex: 1; }
.linkbtn { font: inherit; font-size: 12px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.stat { padding: 14px 16px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat-n { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-l { margin-top: 5px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 26px 0 10px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; }
h2 .count { font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
h3.day { margin: 22px 0 8px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { padding: 10px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); text-align: left; white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.lead td { background: var(--lead-bg); }
.num { text-align: right; }
.rank { width: 40px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 19px; color: var(--ink-2); }
.name { font-weight: 600; white-space: nowrap; }
.w { color: var(--win); font-weight: 700; }
.l { color: var(--loss); font-weight: 700; }
.pct { color: var(--ink-2); }
.form { display: flex; gap: 3px; flex-wrap: wrap; min-width: 60px; }
.dot { width: 12px; height: 12px; border-radius: 3px; background: var(--push-bg); display: inline-block; }
.dot.W { background: var(--win); }
.dot.L { background: var(--loss); }
.dot.P { background: var(--push); }
.dot.live { background: var(--live); }
.dot.none { background: transparent; border: 1px dashed var(--line); }
.week { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
.week summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.week summary::-webkit-details-marker { display: none; }
.week summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }
.wk-label { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .02em; }
.wk-nick { color: var(--ink-3); font-style: italic; }
.wk-date { color: var(--ink-3); }
.chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.rec { background: var(--surface-2); color: var(--ink-2); }
.chip.hit { background: var(--win-bg); color: var(--win); }
.chip.miss { background: var(--loss-bg); color: var(--loss); }
.chip.open { background: var(--push-bg); color: var(--ink-2); }
.chip.play { background: var(--live-bg); color: var(--live); }
.summary-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.caret { color: var(--ink-3); transition: transform .15s; }
.week[open] .caret { transform: rotate(180deg); }
.picks { list-style: none; margin: 0; padding: 4px 14px 10px; border-top: 1px solid var(--line); }
.pick { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.pick:last-child { border-bottom: 0; }
.res { flex: 0 0 24px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 14px; }
.res.W { background: var(--win-bg); color: var(--win); }
.res.L { background: var(--loss-bg); color: var(--loss); }
.res.P { background: var(--push-bg); color: var(--push); }
.res.live { background: var(--live-bg); color: var(--live); }
.res.none { border: 1px dashed var(--line); color: var(--ink-3); }
.pick-name { font-weight: 600; flex: 0 0 96px; }
.pick-text { color: var(--ink-2); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pulse { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px 16px; }
.pulse-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pulse-title { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
.pulse-nick { color: var(--ink-3); font-style: italic; }
.pulse-state { margin-left: auto; }
.chip.big { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; }
.legs { display: flex; gap: 3px; margin-top: 14px; height: 14px; }
.leg { flex: 1; border-radius: 3px; background: var(--push-bg); min-width: 6px; }
.leg.W { background: var(--win); }
.leg.L { background: var(--loss); }
.leg.P { background: var(--push); }
.leg.good { background: var(--win); opacity: .55; }
.leg.bad { background: var(--loss); opacity: .55; }
.leg.even, .leg.manual { background: var(--live); }
.pulse-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.pulse-meta b { color: var(--ink); font-weight: 700; }
.pulse-meta .next { margin-left: auto; color: var(--ink-3); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
.fchip { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.game.is-live { border-color: var(--live); box-shadow: 0 0 0 3px var(--live-bg); }
.game-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 0; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.lg { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.gtitle { color: var(--ink-3); }
.status { margin-left: auto; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
.status.live { color: var(--live); }
.status.final { color: var(--ink-2); }
.status.sched { color: var(--ink-3); }
.ldot { width: 8px; height: 8px; border-radius: 50%; background: var(--live-dot); animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, .55); } 100% { box-shadow: 0 0 0 9px rgba(225, 29, 72, 0); } }
.game-body { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 8px 14px 10px; align-items: center; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.abbr { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .06em; color: var(--ink-3); width: 44px; flex: 0 0 44px; }
.tname { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team.loser .tname { color: var(--ink-3); }
.poss { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: 0 0 8px; }
.score { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; min-width: 34px; }
.score.dim { color: var(--ink-3); }
.score.tbd { color: var(--ink-3); font-size: 14px; font-weight: 600; }
.sit { padding: 0 14px 10px; font-size: 13px; color: var(--ink-2); }
.sit b { color: var(--live); font-weight: 700; }
.riders { border-top: 1px solid var(--line); padding: 4px 14px 6px; }
.rider { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.rider:last-child { border-bottom: 0; }
.rider-name { font-weight: 700; flex: 0 0 76px; }
.rider-pick { color: var(--ink-2); flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.st { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.st.W { background: var(--win-bg); color: var(--win); }
.st.L { background: var(--loss-bg); color: var(--loss); }
.st.P { background: var(--push-bg); color: var(--push); }
.st.good { background: var(--win-bg); color: var(--win); }
.st.bad { background: var(--loss-bg); color: var(--loss); }
.st.even, .st.manual { background: var(--live-bg); color: var(--live); }
.st.pending { background: var(--surface-2); color: var(--ink-3); }
.details { border-top: 1px solid var(--line); background: var(--surface-2); padding: 10px 14px 12px; font-size: 13px; color: var(--ink-2); }
.game:not(.open) .details { display: none; }
.details dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.details dt { color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; align-self: center; }
.details dd { margin: 0; }
.details .need { margin: 0 0 8px; color: var(--ink); }
.more { display: block; width: 100%; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink-3); cursor: pointer; }
.more:hover { color: var(--ink); }
.more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nopick { margin-top: 14px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-3); font-size: 14px; }
.asof { font-size: 12px; color: var(--ink-3); margin: 10px 0 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
footer.about { margin: 30px 0 28px; font-size: 13px; color: var(--ink-3); max-width: 60ch; }
.empty { padding: 18px 14px; color: var(--ink-3); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
@media (max-width: 480px) {
  .stat { padding: 12px 10px; }
  .stat-n { font-size: 26px; }
  .pick-name { flex-basis: 78px; }
  .rider-name { flex-basis: 66px; }
  .tab { font-size: 16px; padding: 9px 12px 11px; }
}
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } .ldot { animation: none; } }
</style>

<body>
<div id="root"><div class="wrap" style="padding-block:40px;color:var(--ink-3)">Loading the board…</div></div>
<script>
(function () {
  'use strict';
  var NFL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
  var CFB = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard';
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var FETCH = window.__parlayFetch || function (u, o) { return window.fetch(u, o); };
  var root = document.getElementById('root');
  var DATA = null;
  var LIVE = {};          /* game id -> overlay from the score feed */
  var feed = { state: 'idle', at: null, error: '' };
  var state = { tab: null, filter: 'all', open: {} };
  var timer = null;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtDate(iso) { if (!iso) return ''; var p = String(iso).split('-'); if (p.length < 3 || !MONTHS[+p[1] - 1]) return iso; return MONTHS[+p[1] - 1] + ' ' + (+p[2]); }
  function fmtKick(iso) { var d = new Date(iso); if (isNaN(d)) return ''; try { return d.toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }); } catch (e) { return d.toString(); } }
  function fmtDay(iso) { var d = new Date(iso); if (isNaN(d)) return 'Date TBD'; try { return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }); } catch (e) { return d.toDateString(); } }
  function fmtClock(d) { try { return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); } catch (e) { return d.toString(); } }
  function countdown(iso) {
    var ms = new Date(iso) - Date.now();
    if (isNaN(ms)) return '';
    if (ms <= 0) return 'kicking off';
    var m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d >= 1) return 'in ' + d + 'd ' + (h % 24) + 'h';
    if (h >= 1) return 'in ' + h + 'h ' + (m % 60) + 'm';
    return 'in ' + Math.max(m, 1) + 'm';
  }
  function ago(t) { var s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; }
  function fmtNum(n) { return (Math.round(n * 10) / 10).toString(); }
  function implied(odds) { var o = +odds; if (!o) return null; return o < 0 ? (-o / (-o + 100)) * 100 : (100 / (o + 100)) * 100; }
  function oddsText(odds) { var o = +odds; if (!o) return ''; return o > 0 ? '+' + o : String(o); }
  function ymd(d) { var m = String(d.getUTCMonth() + 1), day = String(d.getUTCDate()); return d.getUTCFullYear() + (m.length < 2 ? '0' : '') + m + (day.length < 2 ? '0' : '') + day; }

  function roster() {
    var names = (DATA.roster || []).slice();
    DATA.weeks.forEach(function (w) { (w.picks || []).forEach(function (p) { if (p.name && names.indexOf(p.name) < 0) names.push(p.name); }); });
    return names;
  }
  function findPick(week, name) { for (var i = 0; i < week.picks.length; i++) if (week.picks[i].name === name) return week.picks[i]; return null; }
  function gameOf(week, id) { if (!id) return null; for (var i = 0; i < week.games.length; i++) if (week.games[i].id === id) return week.games[i]; return null; }

  /* merged view of a game: baked data.json fields first, then the live feed */
  function gs(g) {
    if (!g) return null;
    var live = LIVE[g.id];
    if (g.status === 'final' && g.as != null && g.hs != null) return { status: 'final', as: +g.as, hs: +g.hs, detail: g.detail || 'Final', period: g.period, clock: '', live: null };
    if (live) return live;
    return { status: g.status || 'scheduled', as: g.as == null ? null : +g.as, hs: g.hs == null ? null : +g.hs, detail: g.detail || '', period: g.period, clock: g.clock || '', live: null };
  }
  function margin(pick, g) {
    var s = gs(g);
    if (!s || s.as == null || s.hs == null) return null;
    var as = s.as, hs = s.hs;
    var mine = pick.side === 'home' ? hs : as, theirs = pick.side === 'home' ? as : hs;
    if (pick.type === 'ml') return mine - theirs;
    if (pick.type === 'spread') return mine + (+pick.line || 0) - theirs;
    if (pick.type === 'total') { var tot = as + hs; return pick.ou === 'over' ? tot - (+pick.line) : (+pick.line) - tot; }
    return null;
  }
  function effResult(pick, week) {
    if (pick.result) return pick.result;
    var g = gameOf(week, pick.game), s = gs(g);
    if (s && s.status === 'final') { var m = margin(pick, g); if (m == null) return ''; return m > 0 ? 'W' : m < 0 ? 'L' : 'P'; }
    return '';
  }
  function pickStatus(pick, week) {
    var r = effResult(pick, week);
    if (r) return { code: r, label: r === 'W' ? 'Won' : r === 'L' ? 'Lost' : 'Push' };
    var g = gameOf(week, pick.game), s = gs(g);
    if (!s || s.status === 'scheduled') return { code: 'pending', label: 'Pending' };
    if (s.status === 'final') return { code: 'manual', label: 'Needs result' };
    var m = margin(pick, g);
    if (m == null) return { code: 'manual', label: 'Tracking' };
    var d = fmtNum(Math.abs(m));
    if (pick.type === 'ml') return m > 0 ? { code: 'good', label: 'Up ' + d } : m < 0 ? { code: 'bad', label: 'Down ' + d } : { code: 'even', label: 'Tied' };
    if (pick.type === 'spread') return m > 0 ? { code: 'good', label: 'Covering by ' + d } : m < 0 ? { code: 'bad', label: 'Short by ' + d } : { code: 'even', label: 'On the number' };
    var ou = pick.ou === 'over' ? 'Over' : 'Under';
    return m > 0 ? { code: 'good', label: ou + ' by ' + d } : m < 0 ? { code: 'bad', label: (pick.ou === 'over' ? 'Under' : 'Over') + ' by ' + d } : { code: 'even', label: 'On the number' };
  }
  function needsText(pick, g) {
    if (!g) return '';
    var team = pick.side === 'home' ? g.homeName : g.awayName;

  function render() {
    if (!DATA) return;
    if (!state.tab) { var cur = currentWeek(); state.tab = (!cur || weekSummary(cur).settled) ? 'season' : 'week'; }
    root.innerHTML = renderMasthead() + '<main class="wrap">' + (state.tab === 'week' ? renderWeekTab() : renderSeasonTab()) + renderFooter() + '</main>';
  }
  function tick() {
    root.querySelectorAll('[data-countdown]').forEach(function (el) { el.textContent = 'Next kickoff ' + countdown(el.getAttribute('data-countdown')); });
    root.querySelectorAll('[data-ago]').forEach(function (el) { el.textContent = ago(+el.getAttribute('data-ago')); });
  }

  /* ---------- events ---------- */
  root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]'); if (!t) return;
    var a = t.getAttribute('data-action');
    if (a === 'tab') { state.tab = t.getAttribute('data-tab'); try { localStorage.setItem('parlay-tab', state.tab); } catch (err) {} render(); window.scrollTo(0, 0); }
    else if (a === 'filter') { state.filter = t.getAttribute('data-filter'); render(); }
    else if (a === 'toggle-game') { var card = t.closest('.game'); var id = card && card.getAttribute('data-game'); if (id) { state.open[id] = !state.open[id]; card.classList.toggle('open', !!state.open[id]); t.textContent = state.open[id] ? 'Hide details' : 'Details'; } }
    else if (a === 'refresh') { refresh(); }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && DATA) refresh(); });

  /* ---------- boot ---------- */
  try { var saved = localStorage.getItem('parlay-tab'); if (saved === 'week' || saved === 'season') state.tab = saved; } catch (e) {}
  function boot(d) {
    DATA = d;
    DATA.weeks = Array.isArray(DATA.weeks) ? DATA.weeks : [];
    DATA.weeks.forEach(function (w) { w.picks = Array.isArray(w.picks) ? w.picks : []; w.games = Array.isArray(w.games) ? w.games : []; });
    render();
    setInterval(tick, 15000);
    refresh();
  }
  var loadData = window.__PARLAY_DATA ? Promise.resolve(window.__PARLAY_DATA) : FETCH('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  loadData.then(boot, function (e) { root.innerHTML = '<div class="wrap" style="padding-block:40px;color:var(--ink-3)">Couldn’t load data.json (' + esc(e && e.message) + ').</div>'; });
})();
</script>
</body>
</html>
